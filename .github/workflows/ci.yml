name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests (stdlib unittest, floor of 39)
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test.log
          ran=$(grep -Eo '^Ran [0-9]+ tests' test.log | grep -Eo '[0-9]+')
          echo "tests ran: $ran"
          if [ "${ran:-0}" -lt 39 ]; then
            echo "::error::expected at least 39 tests, ran ${ran:-0}"
            exit 1
          fi

      - name: Quickstart (sample corpus, shadow then enforce)
        run: |
          set -o pipefail
          python examples/city_guides/run_gate.py
          python examples/city_guides/run_gate.py --enforce --threshold 0.40 | tee enforce.log
          grep -q '^published 6, blocked 6$' enforce.log
